<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Deadlines | UniSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Karla:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="top-bar">
    <img class="logo" src="images/unisphere_logo.png" alt="UniSphere logo" width="32" height="32">
    <input type="search" placeholder="Search.." aria-label="Search UniSphere">
    <img class="profile-pic" src="images/profile.jpg" alt="Your profile" width="32" height="32">
  </header>

  <div class="page-wrapper">

    <!-- The navigation is built by script.js (see NAV_SECTIONS) so it only lives in one place -->
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content" id="main">
      <div class="page-panel">
        <h1>My Deadlines</h1>

        <form id="deadlineForm" class="add-form" novalidate>
          <div class="field field-wide">
            <label for="deadlineText">What</label>
            <input type="text" id="deadlineText" name="text" placeholder="Enter item" autocomplete="off">
          </div>
          <div class="field">
            <label for="deadlineDate">Due date</label>
            <input type="date" id="deadlineDate" name="date">
          </div>
          <button class="add-button" type="submit">Add deadline</button>
          <p class="form-error" role="alert" hidden></p>
        </form>

        <ul id="deadlinesList" class="deadline-list"></ul>

        <div id="deadlineEmpty" class="empty-state" hidden>
          <pre aria-hidden="true">  o
 /|\
 / \</pre>
          <p>No deadlines. Suspicious, but nice.</p>
        </div>
      </div>
    </main>

  </div>

  <script src="script.js" defer></script>
</body>
</html>
